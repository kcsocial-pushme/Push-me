<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Push Me</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f1115" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  :root {
    --bg: #14100f;
    --card: #1f1815;
    --card-border: #33241c;
    --text: #fbf3ee;
    --muted: #b6a89c;
    --accent: #ff6a3d;
    --urgent: #ff3b5c;
    --urgent-bg: rgba(255, 59, 92, 0.14);
    --done: #ffb800;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #241713 0%, #14100f 60%);
    color: var(--text);
    padding: 16px;
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  h1 {
    font-size: 22px;
    margin: 0;
    font-weight: 800;
    letter-spacing: 0.02em;
    background: linear-gradient(90deg, #ff6a3d, #ffb800);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .date-label { color: var(--muted); font-size: 13px; }
  .progress-bar {
    height: 6px;
    background: var(--card-border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .progress-fill {
    height: 100%;
    background: var(--done);
    transition: width 0.3s ease;
  }
  .section-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 18px 0 8px 2px;
  }
  .task {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 8px;
  }
  .task.urgent { border-color: var(--urgent); background: var(--urgent-bg); }
  .task.done { opacity: 0.5; }
  .checkbox {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid var(--muted);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
  }
  .checkbox.checked {
    background: var(--done);
    border-color: var(--done);
  }
  .checkbox svg { width: 14px; height: 14px; display: none; }
  .checkbox.checked svg { display: block; }
  .task-body { flex: 1; min-width: 0; }
  .task-name {
    font-size: 15px;
    word-break: break-word;
  }
  .task.done .task-name { text-decoration: line-through; }
  .task-time {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .task.urgent .task-time { color: var(--urgent); font-weight: 600; }
  .delete-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    flex-shrink: 0;
  }
  .add-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px;
    margin-top: 18px;
  }
  .add-row { display: flex; gap: 8px; }
  input[type="text"], input[type="time"] {
    background: #0f1115;
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
  }
  input[type="text"] { flex: 1; min-width: 0; }
  input[type="time"] { width: 120px; }
  .add-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .empty {
    color: var(--muted);
    text-align: center;
    padding: 24px 0;
    font-size: 14px;
  }
  .reset-link {
    display: block;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 20px;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Push Me</h1>
    <span class="date-label" id="date-label"></span>
  </header>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

  <button class="add-btn" id="wife-toggle" style="background:#262a34; margin-bottom:14px;">Wife available tonight ✓</button>

  <div id="urgent-section"></div>
  <div id="anytime-section"></div>

  <div class="add-form">
    <div class="add-row">
      <input type="text" id="new-task-name" placeholder="Add a task..." />
      <input type="time" id="new-task-time" />
    </div>
    <button class="add-btn" id="add-btn">Add Task</button>
  </div>

  <span class="reset-link" id="reset-link">Clear all tasks for today</span>
</div>

<script>
function todayKey() {
  const d = new Date();
  return 'todos:' + d.toISOString().slice(0,10);
}
function wifeKey() {
  const d = new Date();
  return 'wife-available:' + d.toISOString().slice(0,10);
}

let tasks = [];
let wifeAvailable = true;

function isWednesday() {
  return new Date().getDay() === 3;
}
function isFriday() {
  return new Date().getDay() === 5;
}
function isWeekend() {
  const d = new Date().getDay();
  return d === 0 || d === 6;
}

function defaultTasks(wifeAvail) {
  const morning = [
    { name: 'Exercise (right after waking)', time: '05:30', cat: 'health' },
    { name: 'Breakfast — fruits, egg, light meal, coffee', time: '07:00', cat: 'health' },
    { name: 'Office', time: '09:00', cat: 'work' },
  ];

  if (isWeekend()) {
    const wknd = [
      { name: 'Exercise (right after waking)', time: '05:30', cat: 'health' },
      { name: 'Breakfast — fruits, egg, light meal, coffee', time: '07:00', cat: 'health' },
      { name: 'PR Australia documentation', time: '08:00', cat: 'growth' },
      { name: 'Business / investment work', time: '09:15', cat: 'growth' },
      { name: 'Work', time: '10:30', cat: 'work' },
      { name: 'Back home', time: '21:00', cat: 'work' },
      { name: 'Family time', time: '21:00', cat: 'evening' },
      { name: 'Sleep', time: '23:00', cat: 'evening' },
    ];
    return wknd.map((t, i) => ({ id: 'preset-' + i, name: t.name, time: t.time, done: false, cat: t.cat }));
  }

  if (isFriday()) {
    const fri = [
      { name: 'Exercise (right after waking)', time: '05:30', cat: 'health' },
      { name: 'Breakfast — fruits, egg, light meal, coffee', time: '07:00', cat: 'health' },
      { name: 'Well-being time (rest, self-care, no rush)', time: '08:00', cat: 'health' },
      { name: 'IELTS study', time: '10:00', cat: 'growth' },
      { name: 'Training', time: '12:00', cat: 'growth' },
      { name: 'Work', time: '17:00', cat: 'work' },
      { name: 'Back home', time: '21:00', cat: 'work' },
      { name: 'Family time', time: '21:00', cat: 'evening' },
      { name: 'Sleep', time: '23:00', cat: 'evening' },
    ];
    return fri.map((t, i) => ({ id: 'preset-' + i, name: t.name, time: t.time, done: false, cat: t.cat }));
  }

  if (isWednesday()) {
    const wed = [
      ...morning,
      { name: 'Second job', time: '17:00', cat: 'work' },
      { name: 'Back home', time: '21:00', cat: 'work' },
      { name: 'Wife / family time', time: '21:00', cat: 'evening' },
      { name: 'Sleep', time: '23:00', cat: 'evening' },
    ];
    return wed.map((t, i) => ({ id: 'preset-' + i, name: t.name, time: t.time, done: false, cat: t.cat }));
  }

  const base = [
    ...morning,
    { name: 'Back home', time: '18:00', cat: 'work' },
    { name: 'Rest 1 hour', time: '18:15', cat: 'evening' },
  ];
  if (wifeAvail) {
    base.push({ name: 'Time with wife (priority) + friends/family', time: '19:15', cat: 'evening' });
    base.push({ name: 'IELTS study (1 hr)', time: null, cat: 'growth' });
    base.push({ name: 'Training (1 hr)', time: null, cat: 'growth' });
  } else {
    base.push({ name: 'IELTS study (1 hr)', time: '19:15', cat: 'growth' });
    base.push({ name: 'Training (1 hr)', time: null, cat: 'growth' });
    base.push({ name: 'Family time / friends & family call', time: '21:00', cat: 'evening' });
  }
  base.push({ name: 'Sleep', time: '23:00', cat: 'evening' });
  return base.map((t, i) => ({ id: 'preset-' + i, name: t.name, time: t.time, done: false, cat: t.cat }));
}

async function load() {
  try {
    const res = await window.storage.get(todayKey());
    tasks = res ? JSON.parse(res.value) : null;
  } catch (e) {
    tasks = null;
  }
  try {
    const w = await window.storage.get(wifeKey());
    wifeAvailable = w ? JSON.parse(w.value) : true;
  } catch (e) {
    wifeAvailable = true;
  }
  if (!tasks) {
    tasks = defaultTasks(wifeAvailable);
    await save();
  }
  updateWifeToggleUI();
  render();
}

async function saveWife() {
  try {
    await window.storage.set(wifeKey(), JSON.stringify(wifeAvailable));
  } catch (e) {}
}

function updateWifeToggleUI() {
  const btn = document.getElementById('wife-toggle');
  if (!btn) return;
  if (isWednesday() || isFriday() || isWeekend()) {
    btn.style.display = 'none';
  } else {
    btn.style.display = '';
    btn.textContent = wifeAvailable ? "Wife available tonight ✓" : "Wife not available tonight";
  }
}

async function save() {
  try {
    await window.storage.set(todayKey(), JSON.stringify(tasks));
  } catch (e) {
    console.error('save failed', e);
  }
}

function isUrgent(task) {
  if (task.done || !task.time) return false;
  const now = new Date();
  const [h, m] = task.time.split(':').map(Number);
  const due = new Date();
  due.setHours(h, m, 0, 0);
  const diffMin = (due - now) / 60000;
  return diffMin <= 60; // due within an hour, or overdue
}

function formatTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return h12 + ':' + String(m).padStart(2, '0') + ' ' + period;
}

function render() {
  document.getElementById('date-label').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });

  const sorted = [...tasks].sort((a, b) => {
    if (!!a.done !== !!b.done) return a.done ? 1 : -1;
    if (a.time && b.time) return a.time.localeCompare(b.time);
    if (a.time) return -1;
    if (b.time) return 1;
    return 0;
  });

  const urgentTasks = sorted.filter(t => isUrgent(t));
  const otherTasks = sorted.filter(t => !isUrgent(t));

  const urgentSection = document.getElementById('urgent-section');
  const anytimeSection = document.getElementById('anytime-section');

  urgentSection.innerHTML = urgentTasks.length
    ? '<div class="section-title">Due Soon</div>' + urgentTasks.map(taskHtml).join('')
    : '';

  anytimeSection.innerHTML = '';
  if (otherTasks.length) {
    anytimeSection.innerHTML = '<div class="section-title">Tasks</div>' + otherTasks.map(taskHtml).join('');
  } else if (!urgentTasks.length) {
    anytimeSection.innerHTML = '<div class="empty">No tasks yet. Add one below.</div>';
  }

  const total = tasks.length;
  const done = tasks.filter(t => t.done).length;
  document.getElementById('progress-fill').style.width = total ? Math.round((done/total)*100) + '%' : '0%';

  document.querySelectorAll('[data-check]').forEach(el => {
    el.addEventListener('click', () => toggleDone(el.getAttribute('data-check')));
  });
  document.querySelectorAll('[data-delete]').forEach(el => {
    el.addEventListener('click', () => deleteTask(el.getAttribute('data-delete')));
  });
}

function taskHtml(t) {
  const urgent = isUrgent(t);
  return `
    <div class="task ${urgent ? 'urgent' : ''} ${t.done ? 'done' : ''}">
      <div class="checkbox ${t.done ? 'checked' : ''}" data-check="${t.id}">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>
      </div>
      <div class="task-body">
        <div class="task-name">${escapeHtml(t.name)}</div>
        ${t.time ? `<div class="task-time">${urgent ? 'Due ' : ''}${formatTime(t.time)}</div>` : ''}
      </div>
      <button class="delete-btn" data-delete="${t.id}">×</button>
    </div>
  `;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

async function toggleDone(id) {
  const t = tasks.find(x => x.id === id);
  if (t) t.done = !t.done;
  render();
  await save();
}

async function deleteTask(id) {
  tasks = tasks.filter(x => x.id !== id);
  render();
  await save();
}

async function addTask() {
  const nameInput = document.getElementById('new-task-name');
  const timeInput = document.getElementById('new-task-time');
  const name = nameInput.value.trim();
  if (!name) return;
  tasks.push({ id: Date.now().toString(), name, time: timeInput.value || null, done: false });
  nameInput.value = '';
  timeInput.value = '';
  render();
  await save();
}

document.getElementById('add-btn').addEventListener('click', addTask);
document.getElementById('new-task-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTask();
});
document.getElementById('wife-toggle').addEventListener('click', async () => {
  wifeAvailable = !wifeAvailable;
  updateWifeToggleUI();
  await saveWife();
  if (confirm('Rebuild tonight\'s schedule for this? (Keeps your custom tasks, resets the preset ones)')) {
    const custom = tasks.filter(t => !t.id.startsWith('preset-'));
    tasks = [...defaultTasks(wifeAvailable), ...custom];
    render();
    await save();
  }
});
document.getElementById('reset-link').addEventListener('click', async () => {
  if (confirm('Clear all tasks for today?')) {
    tasks = [];
    render();
    await save();
  }
});

load();
setInterval(render, 60000); // refresh urgency every minute

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
